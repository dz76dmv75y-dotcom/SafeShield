{% extends "base.html" %}
{% load i18n %}

{% block title %}
{% trans "Password Generator" %} | SafeShield Protection
{% endblock %}

{% block content %}

<div class="container py-5">

    <div class="card shadow-lg border-0 rounded-4">

        <div class="card-header bg-success text-white">

            <h2 class="mb-0">
                🎲 {% trans "Password Generator" %}
            </h2>

        </div>

        <div class="card-body">

            <p class="text-muted">
                {% trans "Generate strong and secure passwords to protect your accounts." %}
            </p>

            <div class="mb-4">

                <label class="form-label">
                    {% trans "Password Length" %}
                </label>

                <input type="range"
                       min="8"
                       max="32"
                       value="16"
                       class="form-range"
                       id="lengthRange">

                <div class="text-center fw-bold">
                    <span id="lengthValue">16</span> Characters
                </div>

            </div>

            <div class="row">

                <div class="col-md-6">

                    <div class="form-check">
                        <input class="form-check-input" type="checkbox" checked id="uppercase">
                        <label class="form-check-label" for="uppercase">
                            {% trans "Uppercase Letters" %}
                        </label>
                    </div>

                    <div class="form-check">
                        <input class="form-check-input" type="checkbox" checked id="lowercase">
                        <label class="form-check-label" for="lowercase">
                            {% trans "Lowercase Letters" %}
                        </label>
                    </div>

                </div>

                <div class="col-md-6">

                    <div class="form-check">
                        <input class="form-check-input" type="checkbox" checked id="numbers">
                        <label class="form-check-label" for="numbers">
                            {% trans "Numbers" %}
                        </label>
                    </div>

                    <div class="form-check">
                        <input class="form-check-input" type="checkbox" checked id="symbols">
                        <label class="form-check-label" for="symbols">
                            {% trans "Symbols" %}
                        </label>
                    </div>

                </div>

            </div>

            <div class="mt-4">

                <input type="text"
                       class="form-control form-control-lg text-center fw-bold"
                       id="generatedPassword"
                       value="SafeShield@2026"
                       readonly>

            </div>

            <div class="d-grid gap-2 mt-4">

                <button class="btn btn-success btn-lg">
                    🔄 {% trans "Generate Password" %}
                </button>

                <button class="btn btn-outline-primary btn-lg">
                    📋 {% trans "Copy Password" %}
                </button>

            </div>

        </div>

    </div>

</div>

<script>

const range = document.getElementById("lengthRange");
const value = document.getElementById("lengthValue");

range.oninput = function(){
    value.innerHTML = this.value;
}

</script>

{% endblock %}
